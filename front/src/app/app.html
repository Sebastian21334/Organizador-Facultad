<div class="app-shell">
  @if (auth.isAuthenticated()) {
    <!-- Barra superior compacta, visible solo en mobile -->
    <header class="mobile-topbar">
      <button
        type="button"
        class="menu-toggle"
        (click)="toggleMenu()"
        [attr.aria-expanded]="menuAbierto()"
        aria-label="Abrir menú de navegación"
        aria-controls="app-sidebar-drawer"
      >
        <svg [lucideIcon]="menuIcon" [size]="22" aria-hidden="true"></svg>
      </button>

      <a class="brand-block brand-block--compact" routerLink="/" aria-label="Tempo, ir a Inicio">
        <span class="brand-mark">T</span>
        <span class="brand-name">Tempo</span>
      </a>
    </header>

    <!-- Overlay para cerrar el drawer tocando afuera -->
    @if (menuAbierto()) {
      <div class="sidebar-overlay" (click)="cerrarMenu()" aria-hidden="true"></div>
    }

    <aside
      id="app-sidebar-drawer"
      class="app-sidebar"
      [class.app-sidebar--open]="menuAbierto()"
      aria-label="Navegación principal"
    >
      <a class="brand-block" routerLink="/" (click)="cerrarMenu()" aria-label="Tempo, ir a Inicio">
        <span class="brand-mark">T</span>
        <span class="brand-name">Tempo</span>
        <span class="brand-slogan">Organizá tu vida universitaria.</span>
      </a>

      <nav class="sidebar-nav" aria-label="Navegación principal">
        @for (item of navItems; track item.path) {
          <a
            [routerLink]="item.path"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: item.path === '/' }"
            class="nav-item"
            [attr.aria-label]="item.label"
            [title]="item.label"
            (click)="cerrarMenu()"
          >
            <svg [lucideIcon]="item.icon" [size]="18" aria-hidden="true"></svg>
            <span class="nav-item-label">{{ item.label }}</span>
          </a>
        }

        <button
          type="button"
          class="nav-item nav-item--logout"
          (click)="cerrarSesion()"
          aria-label="Cerrar sesión"
          title="Cerrar sesión"
        >
          <svg [lucideIcon]="logOutIcon" [size]="18" aria-hidden="true"></svg>
          <span class="nav-item-label">Cerrar sesión</span>
        </button>
      </nav>
    </aside>
  }

  <main class="app-content" [class.app-content--full-bleed]="fullBleed()">
    <router-outlet />
  </main>
</div>

<app-confirm-dialog />
