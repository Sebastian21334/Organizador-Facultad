<div class="app-shell">
  @if (auth.isAuthenticated()) {
    <aside class="app-sidebar" aria-label="Navegación principal">
      <a class="brand-block" routerLink="/" aria-label="Tempo, ir a Inicio">
        <span class="brand-mark">T</span>
        <span class="brand-name">Tempo</span>
        <span class="brand-slogan">Organizá tu vida universitaria.</span>
      </a>

      <nav class="sidebar-nav" aria-label="Navegación principal">
        @for (item of navItems; track item.path) {
          <a
            [routerLink]="item.path"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: item.path === '/' }"
            class="nav-item"
            [attr.aria-label]="item.label"
            [title]="item.label"
          >
            <lucide-icon [img]="item.icon" [size]="18" aria-hidden="true"></lucide-icon>
          </a>
        }

        <button
          type="button"
          class="nav-item nav-item--logout"
          (click)="cerrarSesion()"
          aria-label="Cerrar sesión"
          title="Cerrar sesión"
        >
          <lucide-icon [img]="logOutIcon" [size]="18" aria-hidden="true"></lucide-icon>
        </button>
      </nav>
    </aside>
  }

  <main class="app-content" [class.app-content--full-bleed]="fullBleed()">
    <router-outlet />
  </main>
</div>

<app-confirm-dialog />
